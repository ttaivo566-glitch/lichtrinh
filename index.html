<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch Trình Hoạt Động & Nhắc Nhở</title>
  
  <!-- FullCalendar CSS & JS -->
  <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>

  <!-- Tailwind CSS cho thiết kế hiện đại, hài hòa -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>

  <!-- OneSignal Web SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "ĐIỀN_APP_ID_ONESIGNAL_CỦA_BẠN", // Thay App ID của bạn vào đây
      });
    });
  </script>

  <style>
    /* Hiệu ứng morph / chuyển đổi mượt mà */
    .fc { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .fc-theme-standard td, .fc-theme-standard th { border-color: #f3f4f6 !important; }
    .dark .fc-theme-standard td, .dark .fc-theme-standard th { border-color: #374151 !important; }
    
    /* Bo góc mềm mại cho các ô lịch */
    .fc-daygrid-day-frame { border-radius: 1rem; transition: background-color 0.2s; padding: 4px; }
    .fc-daygrid-day-frame:hover { background-color: rgba(99, 102, 241, 0.04); cursor: pointer; }
    .fc-event { border-radius: 0.5rem !important; border: none !important; padding: 3px 6px !important; font-weight: 500; font-size: 0.85rem; }
    
    /* Tùy chỉnh thanh cuộn */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .dark ::-webkit-scrollbar-thumb { background: #4b5563; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen p-4 md:p-8 transition-colors duration-300">

  <div class="max-w-5xl mx-auto bg-white dark:bg-slate-800 p-6 md:p-8 rounded-3xl shadow-xl border border-slate-100 dark:border-slate-700">
    
    <!-- Header ứng dụng -->
    <div class="flex flex-col md:flex-row justify-between items-center pb-6 border-b border-slate-100 dark:border-slate-700 gap-4 mb-6">
      <div class="flex items-center space-x-3">
        <div class="p-3 bg-indigo-50 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 rounded-2xl shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
        </div>
        <div>
          <h1 class="text-xl md:text-2xl font-bold tracking-tight">Lịch Trình Hoạt Động</h1>
          <p class="text-xs text-slate-400">Quản lý công việc & thông báo thông minh</p>
        </div>
      </div>

      <!-- Thanh công cụ hành động -->
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="openAddModal()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-sm font-semibold rounded-xl shadow-md shadow-indigo-200 dark:shadow-none transition-all flex items-center space-x-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          <span>Thêm Hoạt Động</span>
        </button>

        <button onclick="toggleNotificationHistory()" class="p-2.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 active:scale-95 text-slate-600 dark:text-slate-300 rounded-xl transition-all relative" title="Lịch sử thông báo">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
          <span id="notifBadge" class="absolute top-1.5 right-1.5 w-2 h-2 bg-rose-500 rounded-full hidden"></span>
        </button>

        <button onclick="subscribePush()" class="px-3.5 py-2.5 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white text-sm font-semibold rounded-xl shadow-md shadow-emerald-200 dark:shadow-none transition-all flex items-center space-x-1.5">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          <span>Bật Thông Báo</span>
        </button>

        <button onclick="toggleDarkMode()" class="p-2.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 active:scale-95 text-slate-600 dark:text-slate-300 rounded-xl transition-all">
          <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        </button>
      </div>
    </div>

    <!-- Khung hiển thị Lịch FullCalendar -->
    <div id="calendar" class="bg-white dark:bg-slate-800 rounded-2xl p-2"></div>
  </div>

  <!-- MODAL THÊM CÔNG VIỆC -->
  <div id="addModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
    <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-3xl p-6 shadow-2xl border border-slate-100 dark:border-slate-700 transform scale-95 transition-transform duration-300" id="modalContent">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold">Thêm Hoạt Động Mới</h3>
        <button onclick="closeAddModal()" class="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-lg">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      
      <form id="eventForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Tên hoạt động</label>
          <input type="text" id="eventTitle" required placeholder="Ví dụ: Họp chiến lược tuần..." class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Thời gian bắt đầu</label>
            <input type="datetime-local" id="eventStart" required class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Mức độ ưu tiên</label>
            <select id="eventPriority" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
              <option value="#6366f1">Bình thường (Xanh dương)</option>
              <option value="#f59e0b">Quan trọng (Cam dịu)</option>
              <option value="#ef4444">Khẩn cấp (Đỏ dịu)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Mô tả chi tiết</label>
          <textarea id="eventDesc" rows="3" placeholder="Ghi chú thêm về nội dung công việc..." class="w-full px-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm resize-none"></textarea>
        </div>

        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closeAddModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-sm font-semibold rounded-xl transition-all">Hủy</button>
          <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-sm font-semibold rounded-xl shadow-md transition-all">Lưu Hoạt Động</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL XEM CHI TIẾT NGÀY / SỰ KIỆN -->
  <div id="detailModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
    <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-3xl p-6 shadow-2xl border border-slate-100 dark:border-slate-700 transform scale-95 transition-transform duration-300" id="detailModalContent">
      <div class="flex justify-between items-center mb-4">
        <h3 id="detailDateTitle" class="text-lg font-bold">Chi tiết ngày</h3>
        <button onclick="closeDetailModal()" class="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-lg">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      
      <div id="detailEventsList" class="space-y-3 max-h-60 overflow-y-auto mb-4">
        <!-- Danh sách sự kiện trong ngày sẽ được điền bằng JS -->
      </div>

      <div class="flex justify-between items-center pt-3 border-t border-slate-100 dark:border-slate-700">
        <button onclick="openAddModalWithDate()" class="px-4 py-2 bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-100 text-sm font-semibold rounded-xl transition-all">
          + Thêm việc ngày này
        </button>
        <button onclick="closeDetailModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 text-sm font-semibold rounded-xl transition-all">Đóng</button>
      </div>
    </div>
  </div>

  <!-- MODAL LỊCH SỬ THÔNG BÁO -->
  <div id="historyModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
    <div class="bg-white dark:bg-slate-800 w-full max-w-lg rounded-3xl p-6 shadow-2xl border border-slate-100 dark:border-slate-700 transform scale-95 transition-transform duration-300" id="historyModalContent">
      <div class="flex justify-between items-center mb-4">
        <div class="flex items-center space-x-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <h3 class="text-lg font-bold">Lịch Sử Thông Báo Đã Gửi</h3>
        </div>
        <button onclick="toggleNotificationHistory()" class="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-lg">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      
      <div id="historyListContainer" class="space-y-3 max-h-72 overflow-y-auto mb-4 pr-1">
        <!-- Lịch sử hiển thị ở đây -->
      </div>

      <div class="flex justify-between items-center pt-3 border-t border-slate-100 dark:border-slate-700">
        <button onclick="clearHistory()" class="px-4 py-2 bg-rose-50 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400 hover:bg-rose-100 text-sm font-semibold rounded-xl transition-all">Xóa lịch sử</button>
        <button onclick="toggleNotificationHistory()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 text-sm font-semibold rounded-xl transition-all">Đóng</button>
      </div>
    </div>
  </div>

  <script>
    let calendar;
    let selectedDateForNewEvent = '';

    document.addEventListener('DOMContentLoaded', function() {
      // Khởi tạo Dark Mode từ localStorage
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }

      const calendarEl = document.getElementById('calendar');
      
      const defaultEvents = [
        { title: 'Họp chiến lược đầu tuần', start: '2026-10-19T08:30:00', backgroundColor: '#6366f1', description: 'Triển khai công việc tuần mới với các thành viên.' },
        { title: 'Chạy bộ thể dục', start: '2026-10-21T17:30:00', backgroundColor: '#f59e0b', description: 'Rèn luyện sức khỏe tại công viên gần nhà.' }
      ];
      
      const savedEvents = JSON.parse(localStorage.getItem('schedule_events')) || defaultEvents;
      
      // Khởi tạo lịch sử thông báo mẫu nếu chưa có
      if (!localStorage.getItem('notif_history')) {
        const sampleHistory = [
          { title: '🗓️ Lịch trình tuần mới', body: 'Tuần này bạn có 2 hoạt động cần hoàn thành!', time: '19/10/2026 07:00' },
          { title: '📋 Lịch trình ngày mai', body: 'Bạn có 1 hoạt động: Chạy bộ thể dục', time: '20/10/2026 20:00' }
        ];
        localStorage.setItem('notif_history', JSON.stringify(sampleHistory));
      }
      checkNotificationBadge();

      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'vi',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        buttonText: { today: 'Hôm nay', month: 'Tháng', week: 'Tuần', day: 'Ngày' },
        events: savedEvents,
        // Khi bấm vào một ngày trên lịch -> Xem chi tiết các sự kiện trong ngày đó
        dateClick: function(info) {
          selectedDateForNewEvent = info.dateStr;
          showDayDetail(info.dateStr);
        },
        // Khi bấm vào sự kiện cụ thể
        eventClick: function(info) {
          alert(`Hoạt động: ${info.event.title}\nThời gian: ${info.event.start.toLocaleString('vi-VN')}\nMô tả: ${info.event.extendedProps.description || 'Không có mô tả'}`);
        }
      });
      
      calendar.render();
    });

    // --- Modal Thêm Hoạt Động ---
    function openAddModal() {
      document.getElementById('eventStart').value = new Date().toISOString().slice(0, 16);
      const modal = document.getElementById('addModal');
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        document.getElementById('modalContent').classList.remove('scale-95');
      }, 10);
    }

    function openAddModalWithDate() {
      closeDetailModal();
      document.getElementById('eventStart').value = selectedDateForNewEvent + 'T08:00';
      const modal = document.getElementById('addModal');
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        document.getElementById('modalContent').classList.remove('scale-95');
      }, 10);
    }

    function closeAddModal() {
      const modal = document.getElementById('addModal');
      modal.classList.add('opacity-0');
      document.getElementById('modalContent').classList.add('scale-95');
      setTimeout(() => modal.classList.add('hidden'), 300);
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const title = document.getElementById('eventTitle').value;
      const start = document.getElementById('eventStart').value;
      const backgroundColor = document.getElementById('eventPriority').value;
      const description = document.getElementById('eventDesc').value;

      const newEvent = { title, start, backgroundColor, description };
      calendar.addEvent(newEvent);

      let events = JSON.parse(localStorage.getItem('schedule_events')) || [];
      events.push(newEvent);
      localStorage.setItem('schedule_events', JSON.stringify(events));

      // Thêm vào lịch sử thông báo giả lập để test
      addHistoryItem('🔔 Đã thêm hoạt động mới', `Đã lên lịch: "${title}" vào lúc ${new Date(start).toLocaleString('vi-VN')}`);

      closeAddModal();
      document.getElementById('eventForm').reset();
      alert("Đã lưu hoạt động thành công và cập nhật lịch!");
    }

    // --- Modal Xem Chi Tiết Ngày ---
    function showDayDetail(dateStr) {
      selectedDateForNewEvent = dateStr;
      const formattedDate = new Date(dateStr).toLocaleDateString('vi-VN', { weekday: 'long', year: 'numeric', month: 'numeric', day: 'numeric' });
      document.getElementById('detailDateTitle').innerText = `Lịch trình ngày ${formattedDate}`;

      const allEvents = calendar.getEvents();
      const dayEvents = allEvents.filter(ev => ev.startStr.startsWith(dateStr));

      const listContainer = document.getElementById('detailEventsList');
      if (dayEvents.length === 0) {
        listContainer.innerHTML = `<p class="text-sm text-slate-400 text-center py-4">Không có hoạt động nào trong ngày này.</p>`;
      } else {
        listContainer.innerHTML = dayEvents.map(ev => `
          <div class="p-3 bg-slate-50 dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-700 flex justify-between items-center">
            <div>
              <h4 class="font-semibold text-sm">${ev.title}</h4>
              <p class="text-xs text-slate-400">${new Date(ev.start).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} - ${ev.extendedProps.description || 'Không có mô tả'}</p>
            </div>
            <span class="w-3 h-3 rounded-full" style="background-color: ${ev.backgroundColor || '#6366f1'}"></span>
          </div>
        `).join('');
      }

      const modal = document.getElementById('detailModal');
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        document.getElementById('detailModalContent').classList.remove('scale-95');
      }, 10);
    }

    function closeDetailModal() {
      const modal = document.getElementById('detailModal');
      modal.classList.add('opacity-0');
      document.getElementById('detailModalContent').classList.add('scale-95');
      setTimeout(() => modal.classList.add('hidden'), 300);
    }

    // --- Lịch sử thông báo ---
    function toggleNotificationHistory() {
      const modal = document.getElementById('historyModal');
      const isHidden = modal.classList.contains('hidden');
      
      if (isHidden) {
        renderHistoryList();
        modal.classList.remove('hidden');
        setTimeout(() => {
          modal.classList.remove('opacity-0');
          document.getElementById('historyModalContent').classList.remove('scale-95');
        }, 10);
      } else {
        modal.classList.add('opacity-0');
        document.getElementById('historyModalContent').classList.add('scale-95');
        setTimeout(() => modal.classList.add('hidden'), 300);
      }
    }

    function renderHistoryList() {
      const history = JSON.parse(localStorage.getItem('notif_history')) || [];
      const container = document.getElementById('historyListContainer');
      
      if (history.length === 0) {
        container.innerHTML = `<p class="text-sm text-slate-400 text-center py-6">Chưa có lịch sử thông báo nào.</p>`;
        return;
      }

      container.innerHTML = history.map(item => `
        <div class="p-3.5 bg-slate-50 dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-700">
          <div class="flex justify-between items-center mb-1">
            <span class="font-semibold text-sm text-indigo-600 dark:text-indigo-400">${item.title}</span>
            <span class="text-[11px] text-slate-400">${item.time}</span>
          </div>
          <p class="text-xs text-slate-600 dark:text-slate-300">${item.body}</p>
        </div>
      `).join('');
    }

    function addHistoryItem(title, body) {
      let history = JSON.parse(localStorage.getItem('notif_history')) || [];
      const now = new Date();
      const timeStr = `${now.toLocaleDateString('vi-VN')} ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
      history.unshift({ title, body, time: timeStr });
      localStorage.setItem('notif_history', JSON.stringify(history));
      checkNotificationBadge();
    }

    function clearHistory() {
      localStorage.removeItem('notif_history');
      renderHistoryList();
      checkNotificationBadge();
      alert("Đã xóa sạch lịch sử thông báo!");
    }

    function checkNotificationBadge() {
      const history = JSON.parse(localStorage.getItem('notif_history')) || [];
      const badge = document.getElementById('notifBadge');
      if (history.length > 0) {
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    // --- Cấp quyền thông báo OneSignal ---
    async function subscribePush() {
      if (window.OneSignal && window.OneSignal.User) {
        try {
          await OneSignal.User.PushSubscription.optIn();
          alert("Đã kích hoạt đăng ký thông báo thành công trên thiết bị này!");
          addHistoryItem('🔔 Kích hoạt thông báo', 'Thiết bị đã đăng ký nhận thông báo đẩy thành công.');
        } catch (err) {
          alert("Vui lòng cấu hình App ID OneSignal chính xác để sử dụng tính năng này.");
        }
      } else {
        alert("Hệ thống thông báo đang khởi tạo hoặc chạy ngoại tuyến.");
      }
    }

    // --- Chuyển đổi Dark Mode ---
    function toggleDarkMode() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    }
  </script>
</body>
</html>
