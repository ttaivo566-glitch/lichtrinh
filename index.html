<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch Trình Hoạt Động & Nhắc Nhở</title>
  
  <!-- FullCalendar CSS & JS -->
  <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>

  <!-- OneSignal Web SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        // Vị trí này về sau bạn sẽ thay App ID lấy từ OneSignal
        appId: "TAM_THOI_CHUA_CAN_APP_ID", 
      });
    });
  </script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { text-align: center; color: #1a73e8; margin-bottom: 20px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    button { background: #1a73e8; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
    button:hover { background: #1557b0; }
    .btn-notif { background: #34a853; }
    .btn-notif:hover { background: #2b8744; }
    #calendar { margin-top: 15px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>🗓️ Quản Lý Lịch Trình & Thông Báo</h2>
    
    <div class="toolbar">
      <button onclick="addNewEvent()">+ Thêm Hoạt Động Mới</button>
      <button class="btn-notif" onclick="subscribePush()">🔔 Bật Thông Báo Điện Thoại</button>
    </div>

    <div id="calendar"></div>
  </div>

  <script>
    let calendar;

    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');
      
      // Lấy dữ liệu từ LocalStorage hoặc lấy dữ liệu mẫu
      const defaultEvents = [
        { title: 'Họp giao ban đầu tuần', start: '2026-10-19T08:30:00' },
        { title: 'Chạy bộ thể dục', start: '2026-10-21T17:30:00' }
      ];
      const savedEvents = JSON.parse(localStorage.getItem('schedule_events')) || defaultEvents;

      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'vi',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        buttonText: {
          today: 'Hôm nay',
          month: 'Tháng',
          week: 'Tuần',
          day: 'Ngày'
        },
        events: savedEvents
      });
      
      calendar.render();
    });

    // Hàm thêm sự kiện mới và lưu vào LocalStorage
    function addNewEvent() {
      const title = prompt("Nhập tên hoạt động / công việc:");
      if (!title) return;

      const start = prompt("Nhập thời gian (Định dạng: YYYY-MM-DDTHH:mm):", "2026-10-20T09:00");
      if (!start) return;

      const newEvent = { title, start };
      calendar.addEvent(newEvent);

      // Lưu trữ danh sách vào LocalStorage trình duyệt
      let events = JSON.parse(localStorage.getItem('schedule_events')) || [];
      events.push(newEvent);
      localStorage.setItem('schedule_events', JSON.stringify(events));

      alert("Đã lưu hoạt động thành công vào lịch!");
    }

    // Hàm xin quyền nhận thông báo
    async function subscribePush() {
      if (window.OneSignal && window.OneSignal.User) {
        try {
          await OneSignal.User.PushSubscription.optIn();
          alert("Đã kích hoạt đăng ký thông báo!");
        } catch (err) {
          alert("Vui lòng cấu hình App ID OneSignal đúng để bật tính năng này trên Web live.");
        }
      } else {
        alert("Tính năng thông báo cần chạy trên Web Server (HTTPS) kèm App ID OneSignal.");
      }
    }
  </script>
</body>
</html>
