<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quét & Tạo QR Code</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2330;--mut:#6b7686;--bd:#d9dfe8;--ac:#2563eb;--acx:#fff;--ok:#16a34a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141b;--card:#1a212c;--tx:#e8edf5;--mut:#93a0b3;--bd:#2d3746;--ac:#5b8cff;--acx:#0b1220;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10141b;--card:#1a212c;--tx:#e8edf5;--mut:#93a0b3;--bd:#2d3746;--ac:#5b8cff;--acx:#0b1220;--ok:#4ade80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.drop{border:2px dashed var(--bd);border-radius:12px;padding:28px 12px;text-align:center;color:var(--mut);cursor:pointer}
.drop.hot{border-color:var(--ac);background:rgba(37,99,235,.08)}
.drop b{color:var(--tx)}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.res{display:flex;gap:8px;align-items:center;border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:10px;word-break:break-all}
.res .t{flex:1;min-width:0}
.res a{color:var(--ac);text-decoration:underline;cursor:pointer}
.ic{width:36px;height:36px;border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:8px;cursor:pointer;display:grid;place-items:center;flex:none}
.ic.ok{color:var(--ok);border-color:var(--ok)}
.msg{color:var(--mut);margin-top:10px}
.err{color:#dc2626}
#prev{max-width:100%;max-height:220px;border-radius:8px;margin-top:10px;display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input[type=text],select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input[type=color]{width:100%;height:38px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);padding:2px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
#qrbox{display:grid;place-items:center;background:#fff;border-radius:12px;padding:12px;min-height:200px;overflow:auto}
#qrbox canvas,#qrbox svg{max-width:100%;height:auto}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>Quét &amp; Tạo QR Code</h1>
<div class="tabs"><button id="t1" class="on">Quét QR</button><button id="t2">Tạo QR</button></div>

<section id="p1" class="card">
  <div class="drop" id="drop"><b>Bấm để chọn ảnh</b>, kéo thả vào đây hoặc nhấn <b>Ctrl + V</b> để dán ảnh<input type="file" id="file" accept="image/*" hidden></div>
  <img id="prev" alt="">
  <div id="out"></div>
</section>

<section id="p2" class="card hide">
  <div class="grid">
    <div>
      <label>Nội dung / link</label>
      <textarea id="data" rows="3">https://example.com</textarea>
      <div class="row">
        <div><label>Màu chấm</label><input type="color" id="c1" value="#1b2330"></div>
        <div><label>Màu mắt QR</label><input type="color" id="c2" value="#2563eb"></div>
        <div><label>Màu nền</label><input type="color" id="c3" value="#ffffff"></div>
      </div>
      <div class="row">
        <div><label>Kiểu chấm</label><select id="dt"><option value="square">Vuông</option><option value="dots">Tròn</option><option value="rounded">Bo góc</option><option value="extra-rounded">Bo tròn nhiều</option><option value="classy">Classy</option><option value="classy-rounded">Classy bo</option></select></div>
        <div><label>Kiểu mắt</label><select id="cs"><option value="square">Vuông</option><option value="dot">Tròn</option><option value="extra-rounded">Bo tròn</option></select></div>
        <div><label>Kích thước</label><select id="sz"><option>256</option><option selected>320</option><option>512</option><option>1024</option></select></div>
      </div>
      <label>Logo ở giữa (tuỳ chọn)</label>
      <input type="file" id="logo" accept="image/*">
      <label>Cỡ logo: <span id="lv">30</span>%</label>
      <input type="range" id="ls" min="10" max="45" value="30" style="width:100%">
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
        <button class="btn" id="dpng">Tải PNG</button>
        <button class="btn sec" id="dsvg">Tải SVG</button>
        <button class="btn sec" id="rmlogo">Xoá logo</button>
      </div>
    </div>
    <div><div id="qrbox"></div><div class="msg">Logo được che một phần mã, nên đã bật mức sửa lỗi cao nhất (H). Hãy quét thử trước khi dùng.</div></div>
  </div>
</section>
</main>
<script>
const $=s=>document.getElementById(s);
const ICON_COPY='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const ICON_OK='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';
const ICON_OPEN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';

/* Tabs */
function tab(n){$('p1').classList.toggle('hide',n!=1);$('p2').classList.toggle('hide',n!=2);$('t1').classList.toggle('on',n==1);$('t2').classList.toggle('on',n==2);if(n==2)draw();}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);

/* Copy */
async function copyText(t,btn){
  try{await navigator.clipboard.writeText(t);}catch(e){
    const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();
    try{document.execCommand('copy');}catch(_){}a.remove();
  }
  btn.innerHTML=ICON_OK;btn.classList.add('ok');
  setTimeout(()=>{btn.innerHTML=ICON_COPY;btn.classList.remove('ok');},1500);
}
function isUrl(t){return /^https?:\/\/\S+$/i.test(t.trim());}
function openUrl(u){window.open(u,'_blank','noopener,noreferrer');}

/* Scan */
function show(code){
  const out=$('out');out.innerHTML='';
  const text=code.data;
  const row=document.createElement('div');row.className='res';
  const t=document.createElement('div');t.className='t';
  if(isUrl(text)){const a=document.createElement('a');a.textContent=text;a.title='Mở trong tab mới';a.onclick=()=>openUrl(text.trim());t.appendChild(a);}
  else t.textContent=text;
  row.appendChild(t);
  const cb=document.createElement('button');cb.className='ic';cb.title='Sao chép';cb.innerHTML=ICON_COPY;cb.onclick=()=>copyText(text,cb);row.appendChild(cb);
  if(isUrl(text)){const ob=document.createElement('button');ob.className='ic';ob.title='Mở tab mới';ob.innerHTML=ICON_OPEN;ob.onclick=()=>openUrl(text.trim());row.appendChild(ob);}
  out.appendChild(row);
}
function msg(t,err){$('out').innerHTML='<div class="msg'+(err?' err':'')+'">'+t+'</div>';}

function decode(img){
  const w0=img.naturalWidth||img.width,h0=img.naturalHeight||img.height;
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  for(const max of [1600,1000,600,2400]){
    const s=Math.min(1,max/Math.max(w0,h0));
    const w=Math.round(w0*s),h=Math.round(h0*s);
    cv.width=w;cv.height=h;cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);
    const r=jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'attemptBoth'});
    if(r)return r;
  }
  return null;
}
function handleFile(f){
  if(!f||!f.type.startsWith('image/')){msg('Vui lòng chọn một tệp ảnh.',1);return;}
  const url=URL.createObjectURL(f);
  const img=new Image();
  img.onload=()=>{
    $('prev').src=url;$('prev').style.display='block';
    const r=decode(img);
    r?show(r):msg('Không tìm thấy QR code trong ảnh. Hãy thử ảnh rõ nét hơn hoặc cắt sát mã QR.',1);
  };
  img.onerror=()=>msg('Không đọc được ảnh này.',1);
  img.src=url;
}
const drop=$('drop');
drop.onclick=()=>$('file').click();
$('file').onchange=e=>{handleFile(e.target.files[0]);e.target.value='';};
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('hot');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('hot');}));
drop.addEventListener('drop',e=>handleFile(e.dataTransfer.files[0]));
document.addEventListener('paste',e=>{
  if($('p1').classList.contains('hide'))return;
  for(const it of (e.clipboardData||{}).items||[]){
    if(it.type.startsWith('image/')){e.preventDefault();handleFile(it.getAsFile());return;}
  }
});

/* Generate */
let logoUrl=null,qr=null;
function opts(){
  const s=+$('sz').value;
  return{width:s,height:s,type:'canvas',data:$('data').value||' ',image:logoUrl||undefined,margin:8,
    qrOptions:{errorCorrectionLevel:'H'},
    dotsOptions:{type:$('dt').value,color:$('c1').value},
    cornersSquareOptions:{type:$('cs').value,color:$('c2').value},
    cornersDotOptions:{type:$('cs').value==='square'?'square':'dot',color:$('c2').value},
    backgroundOptions:{color:$('c3').value},
    imageOptions:{crossOrigin:'anonymous',margin:4,imageSize:$('ls').value/100,hideBackgroundDots:true}};
}
function draw(){
  $('lv').textContent=$('ls').value;
  if(!qr){qr=new QRCodeStyling(opts());qr.append($('qrbox'));}
  else qr.update(opts());
}
['data','c1','c2','c3','dt','cs','sz','ls'].forEach(i=>$(i).addEventListener('input',draw));
$('logo').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{logoUrl=r.result;draw();};r.readAsDataURL(f);
};
$('rmlogo').onclick=()=>{logoUrl=null;$('logo').value='';draw();};
$('dpng').onclick=()=>qr&&qr.download({name:'qr-code',extension:'png'});
$('dsvg').onclick=()=>qr&&qr.download({name:'qr-code',extension:'svg'});
</script>
</body>
</html>
